<!DOCTYPE html>
<html>
<head>
    <title>Add Marks</title>
</head>

<body>

    <h1>Add Marks</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Student / Course Enrollment:</label>
        <select name="enrollment" required>
            <option value="">Select Enrollment</option>

            {% for enrollment in enrollments %}
                <option value="{{ enrollment.id }}">
                    {{ enrollment.student.name }} - {{ enrollment.course.course_name }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Exam Name:</label>
        <input type="text" name="exam_name" placeholder="e.g. Midterm" required>

        <br><br>

        <label>Marks Obtained:</label>
        <input type="number" name="marks_obtained" step="0.01" min="0" required>

        <br><br>

        <label>Total Marks:</label>
        <input type="number" name="total_marks" step="0.01" min="1" value="100" required>

        <br><br>

        <button type="submit">Save Marks</button>
    </form>

    <br>

    <a href="/teacher-dashboard/">Back to Teacher Dashboard</a>

</body>
</html>
